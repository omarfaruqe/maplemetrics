name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maplemetrics
          POSTGRES_USER: maplemetrics
          POSTGRES_PASSWORD: maplemetrics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maplemetrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: maplemetrics
      POSTGRES_USER: maplemetrics
      POSTGRES_PASSWORD: maplemetrics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt playwright
      - run: playwright install --with-deps chromium
      - run: npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
      - run: pytest apps/core/tests/test_axe_audit.py --no-cov
        env:
          AXE_JS: ${{ runner.temp }}/axe/node_modules/axe-core/axe.min.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install bandit pip-audit
      - name: Code scan (bandit)
        run: bandit -q -r apps config -c pyproject.toml
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, accessibility, security]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t maplemetrics:ci .
      - name: Smoke test the full stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1